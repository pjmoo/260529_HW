<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>황혼과 여명의 기록소 — AetherNotes</title>
    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Material Icons -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />

    <link rel="stylesheet" href="style.css" />

    <style>
      /* ─── 랜딩 페이지 전용 스타일 ─── */
      body {
        justify-content: center;
        align-items: center;
      }
      .landing-wrapper {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
      }
      .landing-header {
        text-align: center;
        animation: fadeInDown 1.2s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .landing-title {
        font-family: var(--font-fancy);
        font-size: 3.5rem;
        font-weight: 700;
        color: var(--color-deep-steel);
        letter-spacing: -1px;
        text-shadow: 0 4px 12px rgba(255, 255, 255, 0.45);
        margin-bottom: 12px;
      }
      .landing-subtitle {
        font-size: 1.15rem;
        letter-spacing: 3px;
        color: rgba(80, 88, 108, 0.85);
        text-transform: uppercase;
        font-weight: 600;
        margin-bottom: 24px;
      }
      .landing-desc {
        max-width: 640px;
        font-size: 1.05rem;
        line-height: 1.8;
        color: #3e4452;
        margin: 0 auto 36px auto;
        word-break: keep-all;
      }
      .btn-container {
        display: flex;
        justify-content: center;
        margin-top: 10px;
      }
      .landing-enter-btn {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 16px 38px;
        border-radius: 20px;
        background: var(--color-deep-steel);
        color: #ffffff;
        font-size: 1.05rem;
        font-weight: 600;
        text-decoration: none;
        box-shadow: 0 8px 32px rgba(80, 88, 108, 0.25);
        transition: var(--transition-cozy);
        border: 1px solid rgba(255, 255, 255, 0.25);
        cursor: pointer;
      }
      .landing-enter-btn i {
        font-size: 1.3rem;
        transition: transform 0.3s ease;
      }
      .landing-enter-btn:hover {
        background: #404656;
        box-shadow: 0 12px 40px rgba(80, 88, 108, 0.4);
        transform: translateY(-4px);
      }
      .landing-enter-btn:hover i {
        transform: translateX(6px);
      }
      .landing-enter-btn:active {
        transform: translateY(-1px);
      }

      /* 에디토리얼 푸터 */
      .landing-footer {
        font-size: 0.8rem;
        color: rgba(80, 88, 108, 0.5);
        letter-spacing: 1px;
        text-transform: uppercase;
        animation: fadeIn 1.8s ease both;
      }

      /* 애니메이션 정의 */
      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-25px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* 모바일 최적화 반응형 */
      @media (max-width: 768px) {
        .landing-title {
          font-size: 2.4rem;
        }
        .landing-subtitle {
          font-size: 0.95rem;
          letter-spacing: 2px;
        }
        .landing-desc {
          font-size: 0.95rem;
          padding: 0 16px;
        }
        .landing-enter-btn {
          padding: 14px 30px;
          font-size: 0.95rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- 몽환적인 백그라운드 오브 -->
    <div class="orb-container">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <div class="landing-wrapper">
      <header class="landing-header">
        <h1 class="landing-title">황혼과 여명의 기록소</h1>
        <p class="landing-subtitle">AetherNotes</p>
        <p class="landing-desc">
          바쁜 삶 속에서 스쳐 지나가는 찬란한 영감과 깊은 단상들, <br />
          마치 황혼과 여명 사이 스러지는 빛처럼 머물 곳이 필요하지 않으신가요?<br />
          차분한 감성이 깃든 당신만의 안식처에서 생각의 편린들을 부드럽게 붙잡아 보세요.
        </p>
        <div class="btn-container">
          <a href="memo.html" class="landing-enter-btn">
            <span>기록소 입장하기</span>
            <i class="material-symbols-outlined">east</i>
          </a>
        </div>
      </header>

      <footer class="landing-footer">
        © 2026 AetherNotes. Crafted with deep reflection.
      </footer>
    </div>
  </body>
</html>
